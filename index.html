<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amethysta&display=swap" rel="stylesheet">
    <script src="main.js"></script>
</head>
<body>
    <div class="main">

        <div class="left">
            <h1>Hey ! </h1>
        </div>

        <div class="right">
            <div class="first">
                <h3>
                    This is not a real online service ! You know you need something<br/>
                    like this in your life to help you realize tour deepest dreams.<br/>
                    Sign up <em>now</em> to get started.
                    <br/><br/>
                    You <em>know</em> you want to.
                </h3>
            </div>

            <div class="second">
                <h2>Let's do this !</h2>
                <form action="" method="get" class="main-form-div">
                    <div class="in-main-form-div">
                        
                        
                        <div class="form-div">
                            <label for="firstName">First Name :</label>
                            <input type="text" id="firstName" name="first_name">
                        </div>
                        

                        <div class="form-div">
                            <label for="email">Email :</label>
                            <input type="email" id="email" name="email">
                        </div>
                        

                        <div class="form-div">
                            <label for="password">Password :</label>
                            <input type="password" id="password" name="password">
                        </div>  
                    </div>

                    <div class="in-main-form-div">
                        <div class="form-div">
                            <label for="lastName">Last Name :</label>
                            <input type="text" id="lastName" name="last_name">
                        </div>
                        

                        <div class="form-div">
                            <label for="phoneNumber">Phone Number :</label>
                            <input type="tell" id="phoneNumber" name="phoneNumber">
                        </div>
                        

                        <div class="form-div">
                            <label for="confirmPassword">Confirm Password :</label>
                            <input type="password" id="confirmPassword" name="confirmPassword">
                        </div>   
                    </div>
                </form>
            </div>

            <div class="third">
                World
            </div>
        </div>

    </div>
    
    
    
</body>
</html>
